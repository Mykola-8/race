<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<title>Race Overlay</title>
<style>
:root{--bg:rgba(27,42,107,.92);--acc:#f5a623;--lx:40px;--ly:40px;--rx:40px;--ry:40px}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase}
.box{position:absolute;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#L{left:var(--lx);bottom:var(--ly);width:400px;transform-origin:bottom left}
#R{right:var(--rx);bottom:var(--ry);width:320px;transform-origin:bottom right}
.off{opacity:0;pointer-events:none}
#L.off{translate:-80px 0}#R.off{translate:80px 0}
.hd{display:flex;align-items:center;gap:10px;background:var(--acc);color:#111;padding:0 12px;height:46px;font-size:22px;font-weight:700;border-radius:8px 8px 0 0}
.hd img{height:34px;max-width:64px;object-fit:contain}
.hd .cl{font-size:13px;opacity:.7;margin-left:auto;font-family:Inter}
.rows{position:relative;background:var(--bg);overflow:hidden;transition:height .5s;border-radius:0 0 8px 8px}
.row{position:absolute;left:0;right:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:20px;font-weight:500;
 border-bottom:1px solid rgba(255,255,255,.12);transition:transform .7s cubic-bezier(.2,.8,.2,1),background .4s,color .4s}
.row.fin{background:#fff;color:#111}
.row .p{width:30px;text-align:right;opacity:.75}
.row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{font-size:18px;font-variant-numeric:tabular-nums;font-family:Inter;font-weight:900}
.row.in{animation:sIn .6s both}
@keyframes sIn{from{opacity:0;translate:-60px 0}to{opacity:1;translate:0 0}}
.rp{background:var(--bg);padding:8px 14px 10px}
.big{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sm{font-size:16px;opacity:.85;display:flex;justify-content:space-between;margin-top:2px}
.avg{background:var(--acc);color:#111;padding:8px 14px;border-radius:0 0 8px 8px;animation:sIn .6s both}
.avg .big{font-size:38px}
</style></head><body>
<div class="box off" id="L"><div class="hd"><img id="lg"><span id="tt"></span><span class="cl" id="cl"></span></div><div class="rows" id="rows"></div></div>
<div class="box off" id="R"><div class="hd"><span>ЧАС</span><span class="cl" id="lapn"></span></div>
 <div class="rp"><div class="big" id="tm">0:00.00</div><div class="sm"><span>Останнє коло</span><b id="ll">—</b></div></div><div id="avgw"></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
        apiKey: "AIzaSyDf6PYBjF096FRE-fUUo5boS8jsieVS9xA",
        authDomain: "padel3-overley.firebaseapp.com",
        databaseURL: "https://padel3-overley-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "padel3-overley",
        storageBucket: "padel3-overley.firebasestorage.app",
        messagingSenderId: "1003185317510",
        appId: "1:1003185317510:web:07be70f0d0354a1f0bd307",
        measurementId: "G-HFRXC32BE1"
    };
const db = getDatabase(initializeApp(firebaseConfig));
const rid = new URLSearchParams(location.search).get('race') || '1';
document.title = 'Race Overlay — ' + rid;
let off = 0; onValue(ref(db, '.info/serverTimeOffset'), s => off = s.val() || 0);
const sNow = () => Date.now() + off;
const $ = q => document.querySelector(q);
let S = {cfg:{}, runners:[], laps:[], fin:[], startTs:0, stopTs:0};
const fmt = ms => { const t=Math.max(0,ms),m=Math.floor(t/60000),s=Math.floor(t%60000/1000),c=Math.floor(t%1000/10); return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0') };
const gap = ms => ms<60000 ? '+'+(ms/1000).toFixed(1) : '+'+Math.floor(ms/60000)+':'+String(Math.floor(ms%60000/1000)).padStart(2,'0')+'.'+Math.floor(ms%1000/100);
const elapsed = () => S.startTs ? (S.stopTs || sNow()) - S.startTs : 0;
const els = {}; let avgKey = null;
onValue(ref(db, 'race/track' + rid), snap => {
  const d = snap.val() || {};
  S = { cfg: d.cfg || {}, runners: d.runners || [], laps: d.laps || [], fin: d.fin || [], startTs: d.startTs || 0, stopTs: d.stopTs || 0 };
  render();
});
function render(){
  const c = Object.assign({dist:10000,lap:400,scaleL:1,scaleR:1,lx:40,ly:40,rx:40,ry:40,showL:true,showR:true,bg:'#1b2a6b',acc:'#f5a623',title:'',club:'',logo:''}, S.cfg);
  const st = document.documentElement.style;
  st.setProperty('--bg', c.bg); st.setProperty('--acc', c.acc);
  ['lx','ly','rx','ry'].forEach(k => st.setProperty('--'+k, c[k]+'px'));
  $('#L').style.scale = c.scaleL; $('#R').style.scale = c.scaleR;
  $('#L').classList.toggle('off', !c.showL); $('#R').classList.toggle('off', !c.showR);
  $('#tt').textContent = c.title; $('#cl').textContent = c.club;
  $('#lg').style.display = c.logo ? '' : 'none'; if (c.logo) $('#lg').src = c.logo;
  const fin = S.fin, ids = new Set(S.runners.map(r => r.id));
  const list = fin.map(f => S.runners.find(r => r.id === f.id)).filter(Boolean).concat(S.runners.filter(r => !fin.some(f => f.id === r.id)));
  $('#rows').style.height = list.length * 40 + 'px';
  Object.keys(els).forEach(id => { if (!ids.has(id)) { els[id].remove(); delete els[id]; } });
  const lead = fin[0];
  list.forEach((r, i) => {
    let e = els[r.id];
    if (!e) { e = els[r.id] = document.createElement('div'); e.className = 'row in'; e.style.animationDelay = i*60+'ms';
      e.innerHTML = '<span class="p"></span><span class="n"></span><span class="g"></span>'; $('#rows').appendChild(e); }
    e.style.transform = 'translateY(' + i*40 + 'px)';
    const f = fin.find(x => x.id === r.id);
    e.classList.toggle('fin', !!f);
    e.children[0].textContent = r.num; e.children[1].textContent = r.name;
    e.children[2].textContent = f ? (f === lead ? fmt(f.t) : gap(f.t - lead.t)) : '';
  });
  const aw = $('#avgw');
  if (lead) {
    const k = lead.id + lead.t;
    if (avgKey !== k) { avgKey = k;
      const v = c.dist / (lead.t/1000), kmh = v*3.6, pace = 1000/v*1000;
      const nm = (S.runners.find(r => r.id === lead.id) || {}).name || '';
      aw.innerHTML = '<div class="avg"><div class="sm"><span class="nm"></span><span>Середня швидкість</span></div><div class="big">' + kmh.toFixed(2) +
        ' км/год</div><div class="sm"><span>Темп</span><b>' + fmt(pace).replace(/\.\d+$/, '') + ' /км</b></div></div>';
      aw.querySelector('.nm').textContent = nm; }
  } else { aw.innerHTML = ''; avgKey = null; }
  const tot = Math.round(c.dist / c.lap), n = S.laps.length;
  $('#lapn').textContent = n + '/' + tot;
  $('#ll').textContent = n ? fmt(S.laps[n-1] - (S.laps[n-2] || 0)) : '—';
}
(function tick(){ $('#tm').textContent = fmt(elapsed()); requestAnimationFrame(tick); })();
</script></body></html>
