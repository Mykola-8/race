  panels.forEach(p => p.tick());
  const b = S.board || {};
  if (b.mode === 'clubs') { const n = clubsList().length;
    if (n) { const p = Math.floor(Math.max(0, sNow() - (b.ts || 0)) / (Math.max(2, +cfgNow().clubSec || 10) * 1000)) % n; if (p !== bPage) renderBoard(); } }
  if (b.mode === 'rules') { const cc = cfgNow(), n = Math.ceil((S.rules || []).length / Math.max(3, +cc.rulesN || 8));
    if (n > 1) { const p = Math.floor(Math.max(0, sNow() - (b.ts || 0)) / (Math.max(3, +cc.rulesSec || 10) * 1000)) % n; if (p !== bPage) renderBoard(); } }
  const sc = Math.floor(sNow() / 1000); if (sc !== wxSec) { wxSec = sc; updWxTime(cfgNow()); }
  const cvEl = document.getElementById('cdv'); if (cvEl) { const tx = cdText(cfgNow()); if (cvEl.textContent !== tx) cvEl.textContent = tx; }
  requestAnimationFrame(tick);
})();
