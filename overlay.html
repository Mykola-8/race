<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<title>Race Overlay</title>
<style>
:root{--bg:rgba(27,42,107,.92);--acc:#f5a623;--lx:40px;--ly:40px;--rx:40px;--ry:40px}
html,body{margin:0;width:1920px;height:1080px;background:transparent;overflow:hidden;color:#fff;font-family:'Oswald',sans-serif;text-transform:uppercase}
.box{position:absolute;transition:opacity .5s,transform .6s cubic-bezier(.2,.8,.2,1)}
#L{left:var(--lx);bottom:var(--ly);width:400px;transform-origin:bottom left}
#R{right:var(--rx);bottom:var(--ry);width:320px;transform-origin:bottom right}
.off{opacity:0;pointer-events:none}
#L.off{translate:-80px 0}#R.off{translate:80px 0}
.hd{display:flex;align-items:center;gap:10px;background:var(--acc);color:#111;padding:0 12px;height:46px;font-size:22px;font-weight:700}
#L .hd{border-radius:0 0 8px 8px;position:relative;z-index:2}
.hd img{height:34px;max-width:64px;object-fit:contain}
.hd .cl{font-size:13px;opacity:.7;margin-left:auto;font-family:Inter}
.rows{position:relative;background:var(--bg);overflow:hidden;transition:height .5s,opacity .4s;border-radius:8px 8px 0 0}
.row{position:absolute;left:0;right:0;height:40px;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:20px;font-weight:500;
 border-bottom:1px solid rgba(255,255,255,.12);transition:transform .7s cubic-bezier(.2,.8,.2,1),background .4s,color .4s}
.row.up{background:rgba(31,157,85,.6)}.row.dn{background:rgba(192,57,43,.5)}
.row.fin{background:#fff;color:#111}
.row .fl{width:34px;height:24px;display:flex;align-items:center;justify-content:center}
.row .fl img{max-width:34px;max-height:24px;border-radius:2px;display:block}
.row .b{width:34px;font-size:15px;opacity:.6;text-align:center}
.row .p{width:30px;text-align:right;opacity:.75}
.row .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .g{font-size:18px;font-variant-numeric:tabular-nums;font-family:Inter;font-weight:900}
.row.in{animation:sUp .8s cubic-bezier(.2,.9,.2,1) both}
@keyframes sUp{from{opacity:0;translate:0 var(--from,60px)}to{opacity:1;translate:0 0}}
@keyframes sIn{from{opacity:0;translate:-60px 0}to{opacity:1;translate:0 0}}
.rp{background:var(--bg);padding:8px 14px 10px}
.big{font-size:54px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.sm{font-size:16px;opacity:.85;display:flex;justify-content:space-between;margin-top:2px}
.fx{position:absolute;transform-origin:center;display:none}
#fli{display:block;height:120px}
#mv{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none}
#mc{display:block;height:360px;width:auto}
.pop{position:absolute;left:0;right:0;bottom:calc(100% + 12px);background:var(--bg);border-radius:8px;overflow:hidden;opacity:0;transform:translateY(60px);transition:transform .6s cubic-bezier(.2,.9,.2,1),opacity .4s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.pop.show{opacity:1;transform:translateY(0)}
.pop .pr{display:flex;justify-content:space-between;align-items:center;padding:6px 14px;font-size:22px}
.pop .pr b{font:900 24px Inter;font-variant-numeric:tabular-nums}
.pop .pm{font:700 44px Oswald;justify-content:flex-end;padding-top:0;padding-bottom:0}
.pop .last{background:var(--acc);color:#111;font-size:20px;padding:6px 14px}
.avg{background:var(--acc);color:#111;padding:8px 14px;border-radius:0 0 8px 8px;animation:sIn .6s both}
.avg .big{font-size:38px}
#Rin{border-radius:8px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#R .rp{padding:4px 14px 6px;border-radius:0}
#dt{background:var(--bg)}
.dr{max-height:0;opacity:0;overflow:hidden;padding:0 14px;transition:max-height .6s cubic-bezier(.2,.9,.2,1),opacity .5s}
.dr.on{max-height:32px;opacity:1}
.dr .sm{margin:0;padding:3px 0}
.row.hid{display:none}
.rows.shut{opacity:0}
#B{z-index:5}
#bi{width:1100px;background:var(--bg);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.bh{display:flex;justify-content:space-between;align-items:center;background:var(--acc);color:#111;padding:0 22px;height:64px;font-size:30px;font-weight:700}
.bh small{font:900 18px Inter}
.bc,.br{display:grid;grid-template-columns:var(--cols);align-items:center;gap:12px;padding:0 22px}
.bc{height:34px;font:900 14px Inter;opacity:.7;border-bottom:1px solid rgba(255,255,255,.2)}
.br{height:var(--rh,42px);font-size:var(--fs,24px);font-weight:500;border-bottom:1px solid rgba(255,255,255,.1)}
.br.w1{background:#fff;color:#111}
.br .pn{opacity:.8;text-align:right}
.br .nm,.br .cb{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .bf img{max-width:44px;max-height:28px;border-radius:2px;display:block}
.r{text-align:right}.br .t{font:900 .85em Inter;font-variant-numeric:tabular-nums}
.anim .br{animation:sIn .6s both}
.dots{display:flex;gap:8px;justify-content:center;padding:12px}
.dots i{width:10px;height:10px;border-radius:5px;background:rgba(255,255,255,.3);transition:.3s}.dots i.on{background:var(--acc);width:28px}
</style></head><body>
<div id="FL" class="fx"><img id="fli"></div><div id="MV" class="fx"><video id="mv" muted loop playsinline autoplay></video><canvas id="mc"></canvas></div>

<div id="B" class="fx"><div id="bi"></div></div>

  if (lead) {
    const k = lead.id + lead.t;
    if (avgKey !== k) { avgKey = k;
      const v = c.dist / (lead.t/1000), kmh = v*3.6, pace = 1000/v*1000;
      const nm = (S.runners.find(r => r.id === lead.id) || {}).name || '';
      aw.innerHTML = '<div class="avg"><div class="sm"><span class="nm"></span><span>Середня швидкість</span></div><div class="big">' + kmh.toFixed(2) +
        ' км/год</div><div class="sm"><span>Темп</span><b>' + fmt(pace).replace(/\.\d+$/, '') + ' /км</b></div></div>';
      aw.querySelector('.nm').textContent = nm; }
  } else { aw.innerHTML = ''; avgKey = null; }
  const n = S.laps.length, cov = covered(n, c);
  $('#lapn').textContent = cov > 0 ? cov + ' / ' + c.dist + ' м' : '';
  const setD = (id, val, idx) => { const d = $('#' + id), on = val != null; d.classList.toggle('on', on); d.style.transitionDelay = on ? idx * 120 + 'ms' : '0ms'; if (on) d.querySelector('b').textContent = val; };
  let ll = null, sp = null, pc = null, lpc = null;
  if (n) { const t = S.laps[n - 1], lt = t - (S.laps[n - 2] || 0), ld = n === 1 ? cov : c.lap;
    if (lt > 0) ll = fmt(lt);
    if (t > 0 && cov > 0) { sp = (cov / (t / 1000) * 3.6).toFixed(1) + ' км/год'; pc = paceG(t, cov); }
    if (lt > 0 && ld > 0) lpc = paceG(lt, ld); }
  setD('d4', lpc, 0); setD('d3', pc, 1); setD('d2', sp, 2); setD('d1', ll, 3);
}
(function tick(){
  $('#tm').textContent = S.startTs ? fmt(elapsed()) : '0:00';
  const b = S.board || {};
  if (b.mode === 'clubs') { const n = clubsList().length;
    if (n) { const p = Math.floor(Math.max(0, sNow() - (b.ts || 0)) / (Math.max(2, +cfgNow().clubSec || 10) * 1000)) % n; if (p !== bPage) renderBoard(); } }
  if (listPage(cfgNow()) !== curLP) render();
  requestAnimationFrame(tick);
})();
</script></body></html>
