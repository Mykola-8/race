<!DOCTYPE html>
<html lang="uk"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Inter:wght@700;900&display=swap" rel="stylesheet">
<title>Race Control</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--blue:#0055ff;--green:#2ecc71;--red:#e74c3c;--bg:#0d0d0f;--sf:#1a1a1e;--bd:rgba(255,255,255,.08)}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,sans-serif;min-height:100vh}
#bar{background:#111114;border-bottom:1px solid var(--bd);padding:10px 12px;display:flex;gap:8px;align-items:center;overflow-x:auto;position:sticky;top:0;z-index:10}
.chip{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--bd);background:transparent;color:rgba(255,255,255,.5);font:900 12px Inter;cursor:pointer}
.chip.active{background:var(--blue);color:#fff;border-color:var(--blue)}
#conn{margin-left:auto;font-size:10px;padding:3px 8px;border-radius:10px;font-weight:900}
#conn.on{background:rgba(46,204,113,.2);color:var(--green)}#conn.offl{background:rgba(231,76,60,.2);color:var(--red)}
main{padding:14px;display:flex;flex-direction:column;gap:12px;max-width:640px;margin:auto}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:16px;padding:14px}
.ttl{font-size:10px;font-weight:900;letter-spacing:2px;color:rgba(255,255,255,.35);text-transform:uppercase;margin:0 0 8px}
#clock{font:700 56px Oswald;text-align:center;font-variant-numeric:tabular-nums}
#info{text-align:center;font-size:12px;opacity:.6;margin-bottom:8px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
button.b{border:0;border-radius:14px;color:#fff;font:700 22px Oswald;text-transform:uppercase;height:72px;cursor:pointer}
button.b:active{transform:scale(.95)}
.go{background:linear-gradient(135deg,#16a34a,#15803d)}.stp{background:linear-gradient(135deg,#dc2626,#b91c1c)}
.lp{background:linear-gradient(135deg,#0055ff,#003dd1)}.gr{background:#444}
.rn{width:100%;display:flex;gap:10px;align-items:center;text-align:left;background:rgba(255,255,255,.06);border:0;border-radius:12px;color:#fff;font:700 18px Oswald;padding:14px;margin-bottom:6px;cursor:pointer}
.rn.done{background:#15803d}.rn .t{margin-left:auto;font-family:Inter;font-size:14px}
.rn:active{transform:scale(.97)}
label{display:block;font-size:11px;opacity:.6;margin:10px 0 4px}
input,textarea{width:100%;background:#0e1016;color:#fff;border:1px solid #333;border-radius:8px;padding:10px;font:600 14px Inter}
input[type=color]{height:40px;padding:2px}input[type=range]{padding:0}
.sw{display:flex;justify-content:space-between;align-items:center;padding:8px 0}
.small{padding:11px;font:900 12px Inter;border-radius:10px;border:0;background:#2b3350;color:#fff;cursor:pointer;width:100%}
#set{display:none}#set.open{display:block}
</style></head><body>
<div id="bar"></div><span id="conn" class="offl" style="display:none"></span>
<main>
 <div class="card"><div id="clock">0:00.00</div><div id="info"></div>
  <div class="g2"><button class="b go" id="bs">▶ Старт</button><button class="b stp" id="bx">■ Стоп</button>
  <button class="b lp" id="bl">⏱ Коло</button><button class="b gr" id="bu">↩ Відмінити</button></div></div>
 <div class="card"><p class="ttl">Фініш — тисни по порядку</p><div id="rl"></div></div>
 <button class="small" id="tg">⚙ НАЛАШТУВАННЯ</button>
 <div id="set" class="card">
  <p class="ttl">Плашки</p>
  <div class="sw"><span>Ліва (учасники)</span><input type="checkbox" id="showL"></div>
  <div class="sw"><span>Права (час)</span><input type="checkbox" id="showR"></div>
  <label>Розмір лівої: <b id="v_scaleL"></b></label><input type="range" id="scaleL" min=".4" max="2.5" step=".05">
  <label>Розмір правої: <b id="v_scaleR"></b></label><input type="range" id="scaleR" min=".4" max="2.5" step=".05">
  <label>Ліва: відступ зліва (px)</label><input type="range" id="lx" min="0" max="1200" step="5">
  <label>Ліва: відступ знизу (px)</label><input type="range" id="ly" min="0" max="900" step="5">
  <label>Права: відступ справа (px)</label><input type="range" id="rx" min="0" max="1200" step="5">
  <label>Права: відступ знизу (px)</label><input type="range" id="ry" min="0" max="900" step="5">
  <p class="ttl" style="margin-top:16px">Забіг</p>
  <label>Назва</label><input id="title"><label>Клуб / організація</label><input id="club">
  <label>Дистанція (м)</label><input id="dist" type="number"><label>Довжина кола (м)</label><input id="lap" type="number">
  <div class="g2"><div><label>Фон</label><input id="bg" type="color"></div><div><label>Акцент</label><input id="acc" type="color"></div></div>
  <label>Логотип</label><input id="logo" type="file" accept="image/*">
  <button class="small" id="nologo" style="margin-top:6px">Прибрати логотип</button>
  <p class="ttl" style="margin-top:16px">Учасники (номер;імʼя — по рядку)</p>
  <textarea id="ppl" rows="9" placeholder="25;MYHRE&#10;24;KIMELI&#10;21;GRESSIER"></textarea>
  <div class="g2" style="margin-top:8px"><button class="small" id="ap">Застосувати список</button><button class="small" id="csv">Завантажити CSV/TXT</button></div>
  <input type="file" id="csvf" hidden accept=".csv,.txt">
  <button class="small" id="rst" style="margin-top:14px;background:#7f1d1d">⟲ СКИНУТИ ГОНКУ</button>
  <p style="font-size:11px;opacity:.5;word-break:break-all">Оверлей: overlay.html?race=<span id="rn"></span></p>
 </div>
</main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
const firebaseConfig = {
        apiKey: "AIzaSyDf6PYBjF096FRE-fUUo5boS8jsieVS9xA",
        authDomain: "padel3-overley.firebaseapp.com",
        databaseURL: "https://padel3-overley-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "padel3-overley",
        storageBucket: "padel3-overley.firebasestorage.app",
        messagingSenderId: "1003185317510",
        appId: "1:1003185317510:web:07be70f0d0354a1f0bd307",
        measurementId: "G-HFRXC32BE1"
    };
const db = getDatabase(initializeApp(firebaseConfig));
const TOTAL = 4, $ = q => document.querySelector(q);
let rid = parseInt(new URLSearchParams(location.search).get('race')) || 1; if (rid < 1 || rid > TOTAL) rid = 1;
let off = 0; onValue(ref(db, '.info/serverTimeOffset'), s => off = s.val() || 0);
const sNow = () => Date.now() + off;
const DEF = {dist:10000,lap:400,scaleL:1,scaleR:1,lx:40,ly:40,rx:40,ry:40,showL:true,showR:true,bg:'#1b2a6b',acc:'#f5a623',title:'10000M FINAL',club:'',logo:''};
let S = {cfg:{...DEF}, runners:[], laps:[], fin:[], startTs:0, stopTs:0}, unsub = null, first = true;
const fmt = ms => { const t=Math.max(0,ms),m=Math.floor(t/60000),s=Math.floor(t%60000/1000),c=Math.floor(t%1000/10); return m+':'+String(s).padStart(2,'0')+'.'+String(c).padStart(2,'0') };
const elapsed = () => S.startTs ? (S.stopTs || sNow()) - S.startTs : 0;
const running = () => S.startTs && !S.stopTs;
let gRef; let pt = null;
function push(){ clearTimeout(pt); pt = setTimeout(() => set(gRef, JSON.parse(JSON.stringify(S))).catch(console.error), 80); }

function buildBar(){
  const bar = $('#bar'); bar.innerHTML = '';
  for (let i = 1; i <= TOTAL; i++) { const b = document.createElement('button'); b.className = 'chip' + (i === rid ? ' active' : ''); b.textContent = 'Race ' + i;
    b.onclick = () => { rid = i; history.replaceState({}, '', '?race=' + i); connect(); buildBar(); }; bar.appendChild(b); }
  bar.appendChild($('#conn')); $('#conn').style.display = '';
}
onValue(ref(db, '.info/connected'), s => { const e = $('#conn'); e.textContent = s.val() ? 'ОНЛАЙН' : 'ОФЛАЙН'; e.className = s.val() ? 'on' : 'offl'; });
function connect(){
  if (unsub) unsub(); first = true; $('#rn').textContent = rid;
  gRef = ref(db, 'race/track' + rid);
  unsub = onValue(gRef, snap => {
    const d = snap.val();
    S = d ? { cfg:{...DEF, ...(d.cfg||{})}, runners:d.runners||[], laps:d.laps||[], fin:d.fin||[], startTs:d.startTs||0, stopTs:d.stopTs||0 }
          : { cfg:{...DEF}, runners:[], laps:[], fin:[], startTs:0, stopTs:0 };
    if (first) { first = false; fillInputs(); }
    renderList();
  });
}
function fillInputs(){
  Object.keys(DEF).forEach(k => { const e = $('#' + k); if (!e || e.type === 'file') return;
    if (e.type === 'checkbox') e.checked = !!S.cfg[k]; else e.value = S.cfg[k]; });
  $('#v_scaleL').textContent = S.cfg.scaleL; $('#v_scaleR').textContent = S.cfg.scaleR;
  $('#ppl').value = S.runners.map(r => r.num + ';' + r.name).join('\n');
}
Object.keys(DEF).forEach(k => { const e = $('#' + k); if (!e || e.type === 'file') return;
  e.oninput = () => { S.cfg[k] = e.type === 'checkbox' ? e.checked : (e.type === 'number' || e.type === 'range') ? +e.value : e.value;
    if (k === 'scaleL' || k === 'scaleR') $('#v_' + k).textContent = e.value; push(); }; });
$('#logo').onchange = e => { const f = e.target.files[0]; if (!f) return; const img = new Image(), u = URL.createObjectURL(f);
  img.onload = () => { const m = 256, r = Math.min(1, m / Math.max(img.width, img.height)), c = document.createElement('canvas');
    c.width = img.width * r; c.height = img.height * r; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    S.cfg.logo = c.toDataURL('image/png'); push(); }; img.src = u; };
$('#nologo').onclick = () => { S.cfg.logo = ''; push(); };
$('#tg').onclick = () => $('#set').classList.toggle('open');
$('#bs').onclick = () => { if (running()) return; if (S.startTs && !confirm('Перезапустити гонку?')) return; S.startTs = sNow(); S.stopTs = 0; S.laps = []; S.fin = []; push(); renderList(); };
$('#bx').onclick = () => { if (running()) { S.stopTs = sNow(); push(); } };
$('#bl').onclick = () => { if (running()) { S.laps.push(elapsed()); push(); renderList(); } };
$('#bu').onclick = () => { S.fin.pop(); push(); renderList(); };
$('#rst').onclick = () => { if (confirm('Скинути гонку?')) { S.startTs = S.stopTs = 0; S.laps = []; S.fin = []; push(); renderList(); } };
$('#ap').onclick = () => {
  S.runners = $('#ppl').value.split('\n').map(l => l.trim()).filter(Boolean).map((l, i) => {
    const p = l.split(/[;,\t]/), hn = p.length > 1 && /^\d+$/.test(p[0].trim());
    return { id: 'r' + i, num: hn ? +p[0] : i + 1, name: (hn ? p.slice(1).join(' ') : l).trim() }; });
  S.fin = []; push(); renderList(); };
$('#csv').onclick = () => $('#csvf').click();
$('#csvf').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => { $('#ppl').value = r.result; $('#ap').click(); }; r.readAsText(f); };
function renderList(){
  const rl = $('#rl'); rl.innerHTML = '';
  const list = S.fin.map(f => S.runners.find(r => r.id === f.id)).filter(Boolean).concat(S.runners.filter(r => !S.fin.some(f => f.id === r.id)));
  list.forEach(r => {
    const i = S.fin.findIndex(f => f.id === r.id), b = document.createElement('button'); b.className = 'rn' + (i > -1 ? ' done' : '');
    const a = document.createElement('span'); a.textContent = (i > -1 ? (i + 1) + '. ' : '') + '#' + r.num + ' ' + r.name; b.appendChild(a);
    if (i > -1) { const t = document.createElement('span'); t.className = 't'; t.textContent = fmt(S.fin[i].t); b.appendChild(t); }
    b.onclick = () => { if (i > -1 || !running()) return; S.fin.push({ id: r.id, t: elapsed() }); push(); renderList(); };
    rl.appendChild(b); });
  const tot = Math.round(S.cfg.dist / S.cfg.lap);
  $('#info').textContent = 'Коло ' + S.laps.length + ' / ' + tot + ' · Фінішувало ' + S.fin.length + ' / ' + S.runners.length;
}
(function tick(){ $('#clock').textContent = fmt(elapsed()); requestAnimationFrame(tick); })();
buildBar(); connect();
</script></body></html>
